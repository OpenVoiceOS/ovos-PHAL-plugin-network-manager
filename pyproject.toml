[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-PHAL-plugin-network-manager"
dynamic = ["version"]
description = "Network Manager plugin for OpenVoiceOS hardware abstraction layer"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Aiix", email = "aix.m@outlook.com"}
]
requires-python = ">=3.5"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: System :: Networking",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "ovos-plugin-manager>=2.1.0,<3.0.0",
    "ovos-utils>=0.0.32,<1.0.0",
    "ovos-bus-client>=0.0.3,<3.0.0"
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-PHAL-plugin-network-manager"

[project.entry-points."opm.phal"]
"ovos-PHAL-plugin-network-manager" = "ovos_PHAL_plugin_network_manager:NetworkManagerPlugin"

[project.entry-points."opm.phal.admin"]
"ovos-PHAL-plugin-network-manager" = "ovos_PHAL_plugin_network_manager:NetworkManagerAdminPlugin"

[tool.setuptools.dynamic]
version = {attr = "ovos_PHAL_plugin_network_manager.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_PHAL_plugin_network_manager*"]

[tool.setuptools.package-data]
ovos_PHAL_plugin_network_manager = ["*.json"]
